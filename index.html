<html>

<head>
    <title>belajar</title>
    <style>
        .container {
            height: auto;
            width: auto;
            max-width: 600px;
            border-radius: 20px;
            border: 2px solid;
            padding: 10px;
        }

        .dataSaya {
            display: flex;
            justify-content: center;
        }

        .biodata {
            display: inline-block;
            margin: 0 30px;
            padding: 0 20px;
        }

        .container img {
            margin: 0;
            padding: 0;
            border: 2px solid;
            object-fit: cover;
            border-radius: 50%;
        }

        .socialMedia {
            height: auto;
            width: 100%;
            padding: 20px 0;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="dataSaya">
            <img src="select.jpg" alt="" height="200px" width="200px">
            <div class="biodata">
                <h1>Nama: LUNA</h1>
                <h1>Umur: 23 tahun</h1>
                <p>luna suka makan kue setiap hari</p>
            </div>
        </div>
        <div class="socialMedia">
            <h1>BERIKUT SOCIAL MEDIA SAYA:</h1>
            <ul>
                <li><a href="#">INSTAGRAM</a></li>
                <li><a href="#">FACEBOOK</a></li>
                <li><a href="#">GITHUB</a></li>
                <li><a href="#">LINKEDIN</a></li>
            </ul>
            <!-- message for author -->
            <input style= "width: 400px;" type="text" name="message" placeholder="masukan pesan untuk author"/>
            <button style="display: block; margin-top: 20px;" type="submit">SUBMIT NOW</button>
        </div>
    </div>

</body>

</html>
